<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mood Board</title>
<style>
*{box-sizing:border-box;cursor:pointer}
html{overflow-x:hidden}
body{margin:0;min-height:100vh;padding:28px 14px;
  background:#2b2220 repeating-linear-gradient(45deg,#2f2523 0 6px,#2b2220 6px 12px);
  font:14px "Lucida Grande","Segoe UI",Tahoma,sans-serif;color:#222}
/* sticky notes, laid out like a pinned-up wall */
.wall{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:30px 26px}
/* a square Post-it: sticky strip on top, paper darkening toward the bottom where it lifts off the wall, curled bottom-right corner */
.note{width:210px;aspect-ratio:1;position:relative;margin:0;padding:24px 14px 16px;
  background:linear-gradient(176deg,var(--paper,#fff27a) 0 55%,color-mix(in srgb,var(--paper,#fff27a) 82%,#6b4a00) 100%);
  border-bottom-right-radius:70px 7px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)) drop-shadow(3px 12px 8px rgba(0,0,0,.4));
  transform:rotate(var(--tilt,0deg));transform-origin:50% 0}
.note::before{content:"";position:absolute;inset:0 0 auto;height:20px;
  background:linear-gradient(rgba(0,0,0,.07),rgba(0,0,0,.02))} /* adhesive strip */
.note img{display:block;width:100%;height:100%;object-fit:cover;background:#222;
  mix-blend-mode:multiply;filter:contrast(1.05) saturate(.85)} /* reads as printed on the paper */
.x{all:unset;position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;z-index:2;
  display:grid;place-items:center;font:700 15px/1 system-ui,sans-serif;color:#fff;background:#b02c26;
  box-shadow:0 2px 4px rgba(0,0,0,.45)}
.x:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* the rip: corner lifts, peels off, falls away */
.note.rip{animation:rip .55s cubic-bezier(.5,0,.9,.4) forwards;transform-origin:0 0;pointer-events:none}
@keyframes rip{
  0%{transform:rotate(var(--tilt,0deg))}
  25%{transform:rotate(-8deg) translate(6px,-10px) skewX(-4deg)}
  100%{transform:rotate(38deg) translate(80px,110vh);opacity:0}}
.empty{color:#a89590;text-align:center;margin-top:30vh}
/* full-size view */
.stage{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:10;place-items:center;padding:20px}
.stage.on{display:grid}
.stage img{max-width:100%;max-height:90vh;object-fit:contain}
@media (prefers-reduced-motion:reduce){.note.rip{animation-duration:.01s}}
</style>
</head>
<body>
<main class="wall" id="wall"></main>
<div class="stage" id="stage" role="dialog" aria-modal="true" aria-label="Photo"><img id="big" alt=""></div>
<script>
// Every image in photos/ becomes a sticky note. Upload a file there on GitHub to add one.
// Ripped-off notes are remembered on this device.
const REPO = 'makaihurstjob-sys/shoot-moodboard';
const IMG = /\.(jpe?g|png|gif|webp|avif)$/i;
const PAPER = ['#fff27a', '#ffd1e0', '#c9f2c2', '#cfe6ff', '#ffd9a8'];
const KEY = 'moodboard-ripped';
const ripped = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
const wall = document.getElementById('wall'), stage = document.getElementById('stage'), big = document.getElementById('big');

stage.onclick = () => { stage.classList.remove('on'); big.removeAttribute('src'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') stage.onclick(); });

function rip(note, name) {
  ripped.add(name); localStorage.setItem(KEY, JSON.stringify([...ripped]));
  note.classList.add('rip');
  // Remove on a timer too: iPhone Safari doesn't always fire animationend, which left a sliver behind.
  let gone = false;
  const done = () => { if (gone) return; gone = true; note.remove(); if (!wall.children.length) showEmpty(); };
  note.addEventListener('animationend', done, {once: true});
  setTimeout(done, 700);
}
function showEmpty() { wall.outerHTML = '<p class="empty" id="wall">Nothing on the board.</p>'; }

(async () => {
  let names = [];
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/photos`);
    if (r.ok) names = (await r.json()).filter(f => IMG.test(f.name)).map(f => f.name).sort();
  } catch {}
  names.filter(n => !ripped.has(n)).forEach((name, i) => {
    const src = 'photos/' + encodeURIComponent(name);
    const note = Object.assign(document.createElement('figure'), {className: 'note'});
    note.style.setProperty('--paper', PAPER[i % PAPER.length]);
    note.style.setProperty('--tilt', ((i * 37 % 7) - 3) + 'deg');
    const img = Object.assign(document.createElement('img'), {src, alt: '', loading: 'lazy'});
    img.onclick = () => { big.src = src; stage.classList.add('on'); };
    const x = Object.assign(document.createElement('button'), {className: 'x', type: 'button', textContent: '×'});
    x.setAttribute('aria-label', 'Rip off this note');
    x.onclick = () => rip(note, name);
    note.append(img, x);
    wall.append(note);
  });
  if (!wall.children.length) showEmpty();
})();
</script>
</body>
</html>
